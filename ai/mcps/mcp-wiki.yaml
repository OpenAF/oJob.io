# Author: OpenAI Assistant
help:
  text   : A standalone STDIO/HTTP MCP wiki knowledge base server (read-only)
  expects:
  - name     : onport
    desc     : If defined starts an HTTP MCP server on this port; otherwise uses STDIO
    example  : "8888"
    mandatory: false
  - name     : wikibackend
    desc     : Wiki backend type (fs, s3, s3fs, es or http; https is an alias)
    example  : "fs"
    mandatory: false
  - name     : wikiroot
    desc     : "Base directory or local .zip/.okt archive for fs backend (archives are always read-only)"
    example  : "./wiki"
    mandatory: false
  - name     : wikibucket
    desc     : S3 bucket for s3 backend
    example  : "my-wiki-bucket"
    mandatory: false
  - name     : wikiprefix
    desc     : S3 key prefix for s3/s3fs backend, or Elasticsearch index for es backend
    example  : "wiki/"
    mandatory: false
  - name     : wikiurl
    desc     : S3 endpoint for s3/s3fs, Elasticsearch/OpenSearch base URL for es, or static wiki base URL for http
    example  : "https://s3.amazonaws.com"
    mandatory: false
  - name     : wikiaccesskey
    desc     : S3 access key, or Elasticsearch username for es backend
    mandatory: false
  - name     : wikisecret
    desc     : S3 secret key, or Elasticsearch password for es backend
    mandatory: false
  - name     : wikiregion
    desc     : S3 region
    mandatory: false
  - name     : wikiuseversion1
    desc     : Force S3 signature version 1
    example  : "false"
    mandatory: false
  - name     : wikiignorecertcheck
    desc     : Ignore TLS cert validation on S3 endpoint
    example  : "false"
    mandatory: false
  - name     : wikis3artifactprefix
    desc     : "Optional S3 prefix containing a published local wiki cache (.mini-a-wiki-lucene/ and .mini-a-wiki-graph/graph.json). It is downloaded to wikiindexdir at startup."
    example  : "wiki-artifacts/"
    mandatory: false
  - name     : s3artifactbundle
    desc     : Use <prefix>/mini-a-wiki-index.zip instead of individual S3 artifact objects
    mandatory: false
  - name     : wikihttpindexurl
    desc     : Optional HTTP artifact bundle URL (defaults to <wikiurl>/mini-a-wiki-index.zip)
    mandatory: false
  - name     : wikihttptimeout
    desc     : HTTP wiki request timeout in milliseconds (default 30000)
    mandatory: false
  - name     : wikiartifactrefreshsecs
    desc     : Recheck an HTTP or bundled-S3 artifact cache after this many seconds between wiki requests (0 disables; default 0)
    example  : "300"
    mandatory: false
  - name     : wikiindexdir
    desc     : Local cache directory used for downloaded S3 search and graph artifacts
    example  : "/var/cache/mini-a/wiki"
    mandatory: false
  - name     : wikilexical
    desc     : "SLON/JSON Lucene lexical configuration. Defaults to {language: 'english'}; supports inline synonyms and an optional synonymsFile."
    example  : "{ language: 'english', synonymsFile: 'synonyms.txt' }"
    mandatory: false
  - name     : toolPrefix
    desc     : Optional prefix prepended to all tool names (e.g. "docs-" -> docs-list, docs-read, ...)
    example  : "wiki-"
    mandatory: false
  - name     : label
    desc     : Human-readable wiki label injected into templated tool descriptions
    example  : "Team wiki"
    mandatory: true
  - name     : wikimounts
    desc     : "SLON/JSON array of read-only wiki mounts: [{name, backend, root|bucket|prefix|url|...}]"
    example  : "[{name: 'team', backend: 'fs', root: './team-wiki'}]"
    mandatory: false
  - name     : usewikigraph
    desc     : "Enable the wiki knowledge graph. Also enabled automatically when `wikigraphfalkorhost` is provided. Search transparently appends related-page hints."
    example  : "false"
    mandatory: false
  - name     : wikigraphfalkorhost
    desc     : FalkorDB host for graph-backed wiki state and queries. Also enables the wiki graph automatically.
    mandatory: false
  - name     : wikigraphfalkorport
    desc     : FalkorDB port
    example  : "6379"
    mandatory: false
  - name     : wikigraphfalkorgraph
    desc     : FalkorDB graph name
    example  : "mini_a_wiki"
    mandatory: false
  - name     : wikigraphfalkoruser
    desc     : FalkorDB username
    mandatory: false
  - name     : wikigraphfalkorpass
    desc     : FalkorDB password
    mandatory: false
  - name     : wikigraphsearchhints
    desc     : Append graph-related pages to search results when the wiki graph is enabled
    example  : "true"
    mandatory: false
  - name     : wikigraphhintcap
    desc     : Maximum graph-hint pages appended to search results
    example  : "5"
    mandatory: false
  - name     : audit
    desc     : "If true (or env OJOB_MCP_AUDIT), logs every MCP tool call (tool name and arguments, handled generically by oJobMCP.yaml) plus every page actually fetched from a remote wikibackend (s3, http, es) -- backend, resolved location (s3://bucket/key, URL, or es:index/path), and byte count -- via OpenAF's log() function. The latter also covers pages fetched internally while serving search/lint/list, not just the top-level read tool call."
    example  : "false"
    mandatory: false

todo:
- Init
- (if    ): "isDef(args.onport)"
  ((then)):
  - (httpdStart   ): "${onport:-8080}"
  - (httpdHealthz ): "${onport:-8080}"
  - (httpdMetrics ): "${onport:-8080}"
  - (httpdMCP     ): "${onport:-8080}"
    ((toolPrefix )): "${toolPrefix:-}"
    ((tplDesc    )): true
    ((description)): &MCPSERVER
      serverInfo:
        name   : mcp-wiki
        title  : "{{label}} knowledge base"
        version: 1.0.0
    ((fnsMeta)): &MCPFNSMETA
      context:
        name       : context
        description: "[ORIENTATION] Get a compact overview of {{label}}: page count, sections, mounts, and recent changes. Call this once at the start of any wiki task before searching or reading."
        inputSchema:
          type      : object
          properties: {}
        annotations:
          title         : context
          readOnlyHint  : true
          idempotentHint: true

      search:
        name       : search
        description: "[START HERE] Search {{label}} pages. This is lexical keyword retrieval, not semantic question answering: use specific keywords, names, aliases, and short phrases. A compatible Lucene index is used when available; otherwise the wiki is scanned. When enabled, graph-related pages may be appended as supplemental hints. Always call this before read. Returns path+title+description per match (no full page content). Then call read() with the most relevant path."
        inputSchema:
          type      : object
          properties:
            query:
              type       : string
              description: "Lexical keyword query for page metadata/body. Prefer exact terms, names, aliases, and short phrases; this is not a semantic natural-language question-answering field."
            limit:
              type       : integer
              description: Maximum number of search results.
              default    : 20
            caseSensitive:
              type       : boolean
              description: Enable case-sensitive matching.
              default    : false
            regex:
              type       : boolean
              description: Treat query as a regular expression.
              default    : false
            contextLines:
              type       : integer
              description: "Number of context lines before/after each match (>0 enables full per-line snippet mode)."
              default    : 0
            path:
              type       : string
              description: Optional single page path to scope the search.
          required  : [ query ]
        annotations:
          title         : search
          readOnlyHint  : true
          idempotentHint: true

      read:
        name       : read
        description: "Read a page from {{label}} by path. For long pages: call with countLines=true first, then with section= to read only the relevant heading. Never read a full page when a section read suffices."
        inputSchema:
          type      : object
          properties:
            path:
              type       : string
              description: "Wiki page path to read. Use @name/path.md for mounted wikis."
            startLine:
              type       : integer
              description: Optional 1-based start line to read from.
            endLine:
              type       : integer
              description: Optional 1-based end line to read to.
            section:
              type       : string
              description: Read only the body under this heading name (faster for long pages).
            countLines:
              type       : boolean
              description: Return only the total line count without body content.
              default    : false
            compact:
              type       : boolean
              description: Return compact output (path/title/body only).
              default    : false
            maxChars:
              type       : integer
              description: Maximum characters returned by agentic MCP reads (default 8000; continuation is returned when exceeded).
          required  : [ path ]
        annotations:
          title         : read
          readOnlyHint  : true
          idempotentHint: true

      open:
        name       : open
        description: "Inspect a page cheaply before reading it. Returns front matter, size, links, and heading boundaries, never the Markdown body. Pass a path or a wiki: reference returned by agentic search."
        inputSchema:
          type      : object
          properties:
            path:
              type       : string
              description: "Wiki path or wiki: reference."
            maxHeadings:
              type       : integer
              description: Maximum heading descriptors to return.
              default    : 40
          required  : [ path ]
        annotations:
          title         : open
          readOnlyHint  : true
          idempotentHint: true

      navigate:
        name       : navigate
        description: "Navigate a wiki folder or a page's heading structure without returning page bodies. For a page, section= returns its parent, children, adjacent sections and deterministic line boundaries."
        inputSchema:
          type      : object
          properties:
            path:
              type       : string
              description: "Folder, page path, or wiki: reference."
            section:
              type       : string
              description: Optional heading title or id for document-level navigation.
          required  : [ path ]
        annotations:
          title         : navigate
          readOnlyHint  : true
          idempotentHint: true

      grep:
        name       : grep
        description: "Find exact terms inside one known page or folder. Returns bounded matching lines and small surrounding context; it never returns a whole document."
        inputSchema:
          type      : object
          properties:
            path: { type: string, description: "Known page, folder, mount path, or wiki: reference." }
            pattern: { type: string, description: "Literal match by default; set regex=true only when needed." }
            limit: { type: integer, default: 20 }
            contextLines: { type: integer, default: 1 }
            regex: { type: boolean, default: false }
            caseSensitive: { type: boolean, default: false }
          required  : [ path, pattern ]
        annotations:
          title         : grep
          readOnlyHint  : true
          idempotentHint: true

      related:
        name       : related
        description: "Optional follow-up discovery from backlinks and the existing graph. Use only when lexical search and page structure leave a gap."
        inputSchema:
          type       : object
          properties:
            path: { type: string, description: "Known page path or wiki: reference." }
            limit: { type: integer, default: 10 }
          required   : [ path ]
        annotations:
          title         : related
          readOnlyHint  : true
          idempotentHint: true

      browse:
        name       : browse
        description: "Explore the section structure of {{label}}. Use after search() fails or for navigation. Less efficient than search for targeted lookup. Shows mounts as virtual top-level sections."
        inputSchema:
          type      : object
          properties:
            path:
              type       : string
              description: "Optional section folder or @name/ mount prefix."
            compact:
              type       : boolean
              description: Return compact navigation output.
              default    : true
        annotations:
          title         : browse
          readOnlyHint  : true
          idempotentHint: true

      tree:
        name       : tree
        description: "Show the folder/page hierarchy of {{label}} as a tree. Use for orientation when you need the shape of the whole wiki rather than a targeted lookup."
        inputSchema:
          type      : object
          properties:
            path:
              type       : string
              description: Optional section folder to start the tree from.
            depth:
              type       : integer
              description: Maximum tree depth to expand.
              default    : 3
            compact:
              type       : boolean
              description: Return compact tree output.
              default    : true
        annotations:
          title         : tree
          readOnlyHint  : true
          idempotentHint: true

      backlinks:
        name       : backlinks
        description: "List the pages in {{label}} that link to a given page. Use to find the context a page sits in, or to check what would break before proposing a change."
        inputSchema:
          type      : object
          properties:
            path:
              type       : string
              description: Wiki page path to find inbound links for.
            compact:
              type       : boolean
              description: Return compact output.
              default    : true
          required  : [ path ]
        annotations:
          title         : backlinks
          readOnlyHint  : true
          idempotentHint: true

      list:
        name       : list
        description: "List pages in {{label}}. Use withMeta=true to get path+title+description+type+updated per page — efficient for scanning the full page inventory in one call."
        inputSchema:
          type      : object
          properties:
            path:
              type       : string
              description: Optional path prefix to filter pages.
            withMeta:
              type       : boolean
              description: Return metadata (title, description, type, updated) per page.
              default    : false
            limit:
              type       : integer
              description: Maximum pages to return when withMeta=true.
              default    : 200
        annotations:
          title         : list
          readOnlyHint  : true
          idempotentHint: true

    ((fns    )): &MCPFNS
      context  : Wiki context overview
      search   : Wiki search pages
      read     : Wiki read page
      open     : Wiki inspect page structure
      navigate : Wiki navigate structure
      grep     : Wiki grep known content
      related  : Wiki related pages
      browse   : Wiki browse section
      tree     : Wiki tree
      backlinks: Wiki backlinks
      list     : Wiki list pages
  ((else)):
  - (stdioMCP  ): *MCPSERVER
    ((toolPrefix)): "${toolPrefix:-}"
    ((tplDesc   )): true
    ((fnsMeta   )): *MCPFNSMETA
    ((fns       )): *MCPFNS

ojob:
  opacks      :
  - openaf     : 20250915
  - oJob-common: 20250914
  - mini-a     : 20260807
  catch       : printErrnl("[" + job.name + "] "); $err(exception, __, __, job.exec)
  logToConsole: false
  argsFromEnvs: true
  daemon      : true
  unique      :
    pidFile     : .mcp-wiki.pid
    killPrevious: true

include:
- oJobMCP.yaml

jobs:
- name : Init
  check:
    in:
      wikibackend         : isString.default("fs")
      wikiroot            : isString.default(__)
      wikibucket          : isString.default(__)
      wikiprefix          : isString.default("wiki/")
      wikiurl             : isString.default("https://s3.amazonaws.com")
      wikiaccesskey       : isString.default(__)
      wikisecret          : isString.default(__)
      wikiregion          : isString.default(__)
      wikiuseversion1     : toBoolean.isBoolean.default(false)
      wikiignorecertcheck : toBoolean.isBoolean.default(false)
      wikis3artifactprefix: isString.default(__)
      s3artifactbundle     : toBoolean.isBoolean.default(false)
      wikihttpindexurl     : isString.default(__)
      wikihttptimeout      : toNumber.isNumber.default(30000)
      wikiartifactrefreshsecs: toNumber.isNumber.default(0)
      wikiindexdir         : isString.default(__)
      wikilexical          : isString.default(__)
      usewikigraph        : toBoolean.isBoolean.default(false)
      wikigraphfalkorhost : isString.default(__)
      wikigraphfalkorport : toNumber.isNumber.default(__)
      wikigraphfalkorgraph: isString.default(__)
      wikigraphfalkoruser : isString.default(__)
      wikigraphfalkorpass : isString.default(__)
      wikigraphsearchhints: toBoolean.isBoolean.default(__)
      wikigraphhintcap    : toNumber.isNumber.default(__)
      label               : isString.default("wiki")
      wikimounts          : isString.default(__)
      audit               : default(__)
  exec : | #js
    loadLib("mini-a-mcp-wiki.js")
    __miniAMcpWikiInit(args, {
      access   : "ro",
      readonly : true,
      agenticRetrieval: true,
      logPrefix: "mcp-wiki"
    })

- name : Wiki context overview
  check:
    in: {}
  exec : | #js
    return global.__wikiTool.wiki({ operation: "context" })

- name : Wiki list pages
  check:
    in:
      path    : isString.default("")
      withMeta: toBoolean.isBoolean.default(false)
      limit   : toNumber.isNumber.default(200)
      compact : toBoolean.isBoolean.default(false)
  exec : | #js
    return global.__wikiTool.wiki({
      operation: "list",
      path     : args.path,
      withMeta : args.withMeta,
      limit    : args.limit,
      compact  : args.compact
    })

- name : Wiki tree
  check:
    in:
      path   : isString.default("")
      depth  : toNumber.isNumber.default(3)
      compact: toBoolean.isBoolean.default(true)
  exec : | #js
    return global.__wikiTool.wiki({
      operation: "tree",
      path     : args.path,
      depth    : args.depth,
      compact  : args.compact
    })

- name : Wiki browse section
  check:
    in:
      path   : isString.default("")
      compact: toBoolean.isBoolean.default(true)
  exec : | #js
    return global.__wikiTool.wiki({
      operation: "browse",
      path     : args.path,
      compact  : args.compact
    })

- name : Wiki read page
  check:
    in:
      path      : isString
      startLine : toNumber.isNumber.default(__)
      endLine   : toNumber.isNumber.default(__)
      section   : isString.default(__)
      countLines: toBoolean.isBoolean.default(false)
      compact   : toBoolean.isBoolean.default(false)
  exec : | #js
    return global.__wikiTool.wiki({
      operation : "read",
      path      : args.path,
      lineStart : args.startLine,
      lineEnd   : args.endLine,
      section   : args.section,
      countLines: args.countLines,
      compact   : args.compact
    })

- name : Wiki search pages
  check:
    in:
      query        : isString
      limit        : toNumber.isNumber.default(20)
      caseSensitive: toBoolean.isBoolean.default(false)
      regex        : toBoolean.isBoolean.default(false)
      contextLines : toNumber.isNumber.default(0)
      path         : isString.default("")
  exec : | #js
    return global.__wikiTool.wiki({
      operation    : "search",
      query        : args.query,
      limit        : args.limit,
      caseSensitive: args.caseSensitive,
      regex        : args.regex,
      contextLines : args.contextLines,
      path         : args.path,
      compact      : args.contextLines === 0
    })

- name : Wiki backlinks
  check:
    in:
      path   : isString
      compact: toBoolean.isBoolean.default(true)
  exec : | #js
    return global.__wikiTool.wiki({
      operation: "backlinks",
      path     : args.path,
      compact  : args.compact
    })
