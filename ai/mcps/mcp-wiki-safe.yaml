# Author: OpenAI Assistant
help:
  text   : A standalone STDIO/HTTP MCP wiki server with restricted retrieval only (opaque references, bounded excerpts, budgeted; safe for untrusted clients)
  expects:
  - name     : onport
    desc     : If defined starts an HTTP MCP server on this port; otherwise uses STDIO
    example  : "8888"
    mandatory: false
  - name     : wikibackend
    desc     : Wiki backend type (fs, s3, s3fs, es or http; https is an alias)
    example  : "fs"
    mandatory: false
  - name     : wikiroot
    desc     : "Base directory or local .zip/.okt archive for fs backend (archives are always read-only)"
    example  : "./wiki"
    mandatory: false
  - name     : wikibucket
    desc     : S3 bucket for s3 backend
    example  : "my-wiki-bucket"
    mandatory: false
  - name     : wikiprefix
    desc     : S3 key prefix for s3/s3fs backend, or Elasticsearch index for es backend
    example  : "wiki/"
    mandatory: false
  - name     : wikiurl
    desc     : S3 endpoint for s3/s3fs, Elasticsearch/OpenSearch base URL for es, or static wiki base URL for http
    example  : "https://s3.amazonaws.com"
    mandatory: false
  - name     : wikiaccesskey
    desc     : S3 access key, or Elasticsearch username for es backend
    mandatory: false
  - name     : wikisecret
    desc     : S3 secret key, or Elasticsearch password for es backend
    mandatory: false
  - name     : wikiregion
    desc     : S3 region
    mandatory: false
  - name     : wikiuseversion1
    desc     : Force S3 signature version 1
    example  : "false"
    mandatory: false
  - name     : wikiignorecertcheck
    desc     : Ignore TLS cert validation on S3 endpoint
    example  : "false"
    mandatory: false
  - name     : wikis3artifactprefix
    desc     : "Optional S3 prefix containing a published local Lucene cache. It is downloaded to wikiindexdir at startup. Graph hints remain disabled by default in restricted retrieval."
    example  : "wiki-artifacts/"
    mandatory: false
  - name     : s3artifactbundle
    desc     : Use <prefix>/mini-a-wiki-index.zip instead of individual S3 artifact objects
    mandatory: false
  - name     : wikihttpindexurl
    desc     : Optional HTTP artifact bundle URL (defaults to <wikiurl>/mini-a-wiki-index.zip)
    mandatory: false
  - name     : wikihttptimeout
    desc     : HTTP wiki request timeout in milliseconds (default 30000)
    mandatory: false
  - name     : wikiartifactrefreshsecs
    desc     : Recheck an HTTP or bundled-S3 artifact cache after this many seconds between wiki requests (0 disables; default 0)
    example  : "300"
    mandatory: false
  - name     : usewikigraph
    desc     : "Opt in to graph-backed related-page hints in restricted search. Hints remain opaque read references and do not expose graph paths or relationship metadata."
    example  : "true"
    mandatory: false
  - name     : wikiindexdir
    desc     : Local cache directory used for downloaded S3 Lucene artifacts
    example  : "/var/cache/mini-a/wiki"
    mandatory: false
  - name     : wikilexical
    desc     : "SLON/JSON Lucene lexical configuration. Defaults to {language: 'english'}; supports inline synonyms and an optional synonymsFile."
    example  : "{ language: 'english', synonymsFile: 'synonyms.txt' }"
    mandatory: false
  - name     : toolPrefix
    desc     : Optional prefix prepended to all tool names (e.g. "docs-" -> docs-search, docs-read)
    example  : "wiki-"
    mandatory: false
  - name     : label
    desc     : Human-readable wiki label injected into templated tool descriptions
    example  : "Team wiki"
    mandatory: true
  - name     : wikimounts
    desc     : "SLON/JSON array of read-only wiki mounts: [{name, backend, root|bucket|prefix|url|...}]"
    example  : "[{name: 'team', backend: 'fs', root: './team-wiki'}]"
    mandatory: false
  - name     : wikirestrictprofile
    desc     : "Restricted retrieval default profile: tight, moderate, relaxed or off. Defaults to tight. Explicit individual restriction settings override profile values. 'off' disables restricted retrieval entirely (raw search/read, no opaque references, no budgets) -- equivalent to running the unrestricted mcp-wiki.yaml server; only use it for trusted clients."
    example  : "moderate"
    mandatory: false
  - name     : wikirestrictsearchlimit
    desc     : "Maximum search results (default: 3; ceiling: 10)"
    mandatory: false
  - name     : wikirestrictminquerychars
    desc     : "Minimum useful query length (default: 4)"
    mandatory: false
  - name     : wikirestrictmetachars
    desc     : "Metadata character cap per result (default: 300)"
    mandatory: false
  - name     : wikirestrictreadlines
    desc     : "Maximum excerpt lines (default: 40; ceiling: 100)"
    mandatory: false
  - name     : wikirestrictreadchars
    desc     : "Maximum excerpt characters (default: 6000; ceiling: 16000)"
    mandatory: false
  - name     : wikirestrictrefttl
    desc     : "Opaque reference lifetime in seconds (default: 120)"
    mandatory: false
  - name     : wikirestrictmaxsearches
    desc     : "Searches per budget window (default: 30)"
    mandatory: false
  - name     : wikirestrictmaxreads
    desc     : "Reads per budget window (default: 15)"
    mandatory: false
  - name     : wikirestrictmaxchars
    desc     : "Total disclosed characters per budget window (default: 60000)"
    mandatory: false
  - name     : wikirestrictwindow
    desc     : "Budget window in seconds (default: 3600)"
    mandatory: false
  - name     : wikirestrictpagecooldown
    desc     : "Delay before a page may receive another reference (default: 3600)"
    mandatory: false
  - name     : wikirestrictstate
    desc     : Optional persistent restricted-retrieval ledger path outside wikiroot
    mandatory: false
  - name     : wikirestrictrefch
    desc     : "SLON/JSON OpenAF channel definition to store search-issued references and page cooldowns (default: this process's own memory only). Set this to share references across multiple mcp-wiki-safe replicas behind the same load balancer (e.g. Kubernetes), so a read call can consume a reference issued by a search call on a different replica. Use a channel with real per-key ops across writers, such as redis (`simple`/`file` are single-writer only, fine standalone but unsafe shared by concurrent replicas). Entries are discarded once their TTL/cooldown elapses."
    example  : "(type: 'redis', options: (host: 'redis.svc', port: 6379))"
    mandatory: false
  - name     : audit
    desc     : "If true (or env OJOB_MCP_AUDIT), logs every MCP tool call (tool name and arguments, handled generically by oJobMCP.yaml) plus every page actually fetched from a remote wikibackend (s3, http, es) -- backend, resolved location (s3://bucket/key, URL, or es:index/path), and byte count -- via OpenAF's log() function. Only the resolved location is logged, never the opaque reference exposed to restricted-mode callers."
    example  : "false"
    mandatory: false

todo:
- Init
- (if    ): "isDef(args.onport)"
  ((then)):
  - (httpdStart   ): "${onport:-8080}"
  - (httpdHealthz ): "${onport:-8080}"
  - (httpdMetrics ): "${onport:-8080}"
  - (httpdMCP     ): "${onport:-8080}"
    ((toolPrefix )): "${toolPrefix:-}"
    ((tplDesc    )): true
    ((description)): &MCPSERVER
      serverInfo:
        name   : mcp-wiki-safe
        title  : "{{label}} knowledge base"
        version: 1.0.0
    ((fnsMeta)): &MCPFNSMETA
      search:
        name       : search
        description: "[START HERE] Search {{label}} for a targeted answer. This is lexical keyword retrieval, not semantic question answering: use specific keywords, names, aliases, and short phrases. A compatible Lucene index is used when available; otherwise the permitted wiki scope is scanned. When explicitly enabled, graph-related pages may be returned only as opaque supplemental references. Always call this before read. Returns bounded title+description metadata and an opaque, short-lived read reference per match; it never returns page paths or full content. Safe-mode policy caps results and disables broad/scoped/regex/context searches."
        inputSchema:
          type      : object
          properties:
            query:
              type       : string
              description: "Lexical keyword query for page metadata/body. Prefer exact terms, names, aliases, and short phrases; this is not a semantic natural-language question-answering field. Must meet the configured minimum length."
            limit:
              type       : integer
              description: Maximum results requested; safe-mode policy applies its lower configured cap.
              default    : 20
            caseSensitive:
              type       : boolean
              description: Accepted for compatibility; safe mode always uses case-insensitive matching.
              default    : false
            regex:
              type       : boolean
              description: Accepted for compatibility; safe mode never enables regular-expression matching.
              default    : false
            contextLines:
              type       : integer
              description: Accepted for compatibility; safe mode returns bounded metadata instead of line snippets.
              default    : 0
            path:
              type       : string
              description: Accepted for compatibility; safe mode searches the permitted wiki scope rather than a caller-supplied path.
          required  : [ query ]
        annotations:
          title         : search
          readOnlyHint  : true
          idempotentHint: true

      read:
        name       : read
        description: "Read a bounded excerpt from {{label}} using the opaque reference returned by search. References are single-use and short-lived. For a focused excerpt, use section= or a valid startLine/endLine range; the configured line and character caps still apply."
        inputSchema:
          type      : object
          properties:
            path:
              type       : string
              description: Opaque reference returned by search, not a wiki page path.
            startLine:
              type       : integer
              description: Optional 1-based excerpt start line; the requested range must fit within the safe-mode line cap.
            endLine:
              type       : integer
              description: Optional 1-based excerpt end line; the requested range must fit within the safe-mode line cap.
            section:
              type       : string
              description: Read only the body under this heading name, subject to the safe-mode excerpt caps.
            countLines:
              type       : boolean
              description: Accepted for compatibility but unavailable in safe mode, because it would disclose page structure.
              default    : false
            compact:
              type       : boolean
              description: Accepted for compatibility; safe mode always returns its bounded content-only response.
              default    : false
          required  : [ path ]
        annotations:
          title         : read
          readOnlyHint  : true
          idempotentHint: true

    ((fns    )): &MCPFNS
      search: Wiki search pages
      read  : Wiki read page
  ((else)):
  - (stdioMCP  ): *MCPSERVER
    ((toolPrefix)): "${toolPrefix:-}"
    ((tplDesc   )): true
    ((fnsMeta   )): *MCPFNSMETA
    ((fns       )): *MCPFNS

ojob:
  opacks      :
  - openaf     : 20250915
  - oJob-common: 20250914
  - mini-a     : 20260807
  catch       : printErrnl("[" + job.name + "] "); $err(exception, __, __, job.exec)
  logToConsole: false
  argsFromEnvs: true
  daemon      : true
  unique      :
    pidFile     : .mcp-wiki-safe.pid
    killPrevious: true

include:
- oJobMCP.yaml

jobs:
- name : Init
  check:
    in:
      wikibackend             : isString.default("fs")
      wikiroot                : isString.default(__)
      wikibucket              : isString.default(__)
      wikiprefix              : isString.default("wiki/")
      wikiurl                 : isString.default("https://s3.amazonaws.com")
      wikiaccesskey           : isString.default(__)
      wikisecret              : isString.default(__)
      wikiregion              : isString.default(__)
      wikiuseversion1         : toBoolean.isBoolean.default(false)
      wikiignorecertcheck     : toBoolean.isBoolean.default(false)
      wikis3artifactprefix    : isString.default(__)
      s3artifactbundle        : toBoolean.isBoolean.default(false)
      wikihttpindexurl        : isString.default(__)
      wikihttptimeout         : toNumber.isNumber.default(30000)
      wikiartifactrefreshsecs : toNumber.isNumber.default(0)
      wikiindexdir            : isString.default(__)
      wikilexical             : isString.default(__)
      usewikigraph            : toBoolean.isBoolean.default(false)
      wikirestrictprofile     : isString.default("tight")
      wikirestrictsearchlimit : toNumber.isNumber.default(__)
      wikirestrictminquerychars: toNumber.isNumber.default(__)
      wikirestrictmetachars   : toNumber.isNumber.default(__)
      wikirestrictreadlines   : toNumber.isNumber.default(__)
      wikirestrictreadchars   : toNumber.isNumber.default(__)
      wikirestrictrefttl      : toNumber.isNumber.default(__)
      wikirestrictmaxsearches : toNumber.isNumber.default(__)
      wikirestrictmaxreads    : toNumber.isNumber.default(__)
      wikirestrictmaxchars    : toNumber.isNumber.default(__)
      wikirestrictwindow      : toNumber.isNumber.default(__)
      wikirestrictpagecooldown: toNumber.isNumber.default(__)
      wikirestrictstate       : isString.default(__)
      wikirestrictrefch       : isString.default(__)
      label                   : isString.default("wiki")
      wikimounts              : isString.default(__)
      audit                   : default(__)
  exec : | #js
    loadLib("mini-a-mcp-wiki.js")
    // restricted retrieval is this server's default and only supported mode,
    // regardless of any caller-supplied/env "wikirestrict" value, EXCEPT for
    // the explicit "off" profile below, which is an opt-in escape hatch that
    // turns this server into an unrestricted one (same as mcp-wiki.yaml).
    var restrictOff = isString(args.wikirestrictprofile) && args.wikirestrictprofile.trim().toLowerCase() === "off"
    args.wikirestrict = !restrictOff
    var info = __miniAMcpWikiInit(args, {
      access                  : "ro",
      readonly                : true,
      allowRestrictedGraphHints: args.usewikigraph === true,
      logPrefix               : "mcp-wiki-safe"
    })
    if (restrictOff) {
      if (isMap(info.restriction) && info.restriction.enabled === true) throw "mcp-wiki-safe: restricted retrieval failed to deactivate"
      printErrnl("[mcp-wiki-safe] WARNING: restricted retrieval disabled (profile: off) -- serving raw, unbounded search/read; only expose this to trusted clients")
    } else {
      if (!isMap(info.restriction) || info.restriction.enabled !== true) throw "mcp-wiki-safe: restricted retrieval failed to activate"
    }

- name : Wiki search pages
  check:
    in:
      query        : isString
      limit        : toNumber.isNumber.default(20)
      caseSensitive: toBoolean.isBoolean.default(false)
      regex        : toBoolean.isBoolean.default(false)
      contextLines : toNumber.isNumber.default(0)
      path         : isString.default("")
  exec : | #js
    return __miniAMcpWikiRestrictedSearch(args)

- name : Wiki read page
  check:
    in:
      path      : isString
      startLine : toNumber.isNumber.default(__)
      endLine   : toNumber.isNumber.default(__)
      section   : isString.default(__)
      countLines: toBoolean.isBoolean.default(false)
      compact   : toBoolean.isBoolean.default(false)
  exec : | #js
    return __miniAMcpWikiRestrictedRead(args)
