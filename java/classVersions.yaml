# Author: Nuno Aguiar
help:
  text   : Retrieves a list of Java class versions from a local folder or from a list of jars 
  expects: 
  - name     : path
    desc     : The path where the JAR files are located
    example  : .
    mandatory: false
  - name     : file
    desc     : The class or single jar filename path to analyze the JVM version
    example  : myClass.class
    mandatory: false
  - name     : summary
    desc     : When summary=true checking multiple classes or jar output only a summary
    example  : "true"
    mandatory: false

todo:
- Check options
- Process

ojob:
  opacks      :
  - openaf: 20250725
  catch       : printErrnl("[" + job.name + "] "); if (isDef(exception.javaException)) exception.javaException.printStackTrace(); else printErr(exception)
  logToConsole: false   # to change when finished
        
#include:
#- ojob.io/common/ojob

jobs:
- name : Check options
  check:
    in:
      path   : isString.default(__)
      file   : isString.default(__)
      summary: toBoolean.isBoolean.default(false)
  exec : |
    if (isUnDef(args.path) && isUnDef(args.file)) throw "Please provide a path or a jar/class file"

# --------------
- name : Process
  check:
    in:
      path   : isString.default(__)
      file   : isString.default(__)
      summary: toBoolean.isBoolean.default(false)
  exec : |
    var res = [], data = []
    ow.loadJava()

    // Normalize Java byte[] before getClassVersion's JavaScript type checks.
    var classVersion = file => ow.java.getClassVersion(Array.from(io.readFileBytes(file)))
    var jarClasses = file => {
      plugin("ZIP")
      var zip = new ZIP()
      return Object.keys(zip.list(file)).filter(cls => cls.endsWith(".class"))
    }

    if (isDef(args.file) && io.fileInfo(args.file).isFile) {
      if (args.file.endsWith(".jar")) {
        jarClasses(args.file)
        .forEach(cls => {
          var ver = classVersion(args.file + "::" + cls)
          data.push({
            class  : cls,
            version: ver
          })
        })
      } else {
        var ver = classVersion(args.file)
        data.push({
          class  : args.file,
          version: ver
        })
      }
    } else {
      if (isDef(args.path) && io.fileInfo(args.path).isDirectory) {
        $from(io.listFiles(args.path).files)
        .ends("filename", ".class")
        .orEnds("filename", ".jar")
        .select(cls => {
          var ver
          if (cls.filename.endsWith(".class")) {
            ver = classVersion(cls.canonicalPath)
            data.push({
              classOrJar: cls.filename,
              version   : ver
            })
          }
          if (cls.filename.endsWith(".jar")) {
            var versions = []
            jarClasses(cls.canonicalPath).forEach(entry => {
              var version = classVersion(cls.canonicalPath + "::" + entry)
              if (isDef(version) && versions.indexOf(version) < 0) versions.push(version)
            })
            versions.forEach(ver => {
              data.push({
                classOrJar: cls.filename,
                version   : ver
              })
            })
          }
        })
      }
    }

    data.forEach(r => {
      if (isUnDef(r.version)) r.version = "undetermined"
    })

    if (args.summary) {
      var ver = {}
      data.forEach(r => {
        if (isUnDef(ver[r.version])) ver[r.version] = 1; else ver[r.version] += 1
      })
      data = Object.keys(ver).map(v => ({
        version: Number(v),
        count  : ver[v]
      }))
      data = $from(data).sort("version").select()
    }

    ow.oJob.output(data, args)
