# Author: Nuno Aguiar
help:
  text   : Recreates a source folder's structure on a target folder and converts all .html files found into .md files on the corresponding target subfolders
  expects:
  - name     : source
    desc     : The source folder to scan recursively for .html files
    example  : ./site
    mandatory: true
  - name     : target
    desc     : The target folder where the folder structure and converted .md files will be written
    example  : ./site-md
    mandatory: true
  - name     : addtitle
    desc     : If Markdown has no level-one heading, prepend a title from the filename, replacing hyphens and underscores with spaces (defaults to false)
    example  : true

todo:
- Recreate folder structure
- Convert HTML files to Markdown

ojob:
  sequential  : true
  opacks      :
  - openaf: 20221216
  - mdconvert
  loadLibs    :
  - mdconvert.js
  catch       : logErr(exception)
  logToConsole: true

jobs:
# ---------------------------
- name: Recreate folder structure
  check:
    in:
      source: isString
      target: isString
  exec: |
    args.source = args.source.replace(/[\/\\]+$/, "")
    args.target = args.target.replace(/[\/\\]+$/, "")

    io.mkdir(args.target)

    global.entries = listFilesRecursive(args.source)

    global.entries.filter(f => f.isDirectory).forEach(f => {
      io.mkdir(args.target + f.filepath.substring(args.source.length))
    })

# -------------------------------------
- name: Convert HTML files to Markdown
  check:
    in:
      addtitle: toBoolean.isBoolean.default(false)
  exec: |
    var htmlFiles = global.entries.filter(f =>
      !f.isDirectory && /\.html$/i.test(f.filename)
    )

    pForEach(htmlFiles, f => {
      var rel  = f.filepath.substring(args.source.length).replace(/\.html$/i, ".md")
      var html = io.readFileString(f.canonicalPath)
      var md   = mdconvert.html2md(html)
      if (args.addtitle) {
        // Ignore fenced code when looking for ATX or Setext level-one headings.
        var fence, previous = "", hasTitle = false
        md.split(/\r?\n/).forEach(line => {
          var match = line.match(/^ {0,3}(`{3,}|~{3,})/)
          if (fence) {
            if (match && match[1].charAt(0) == fence.charAt(0) && match[1].length >= fence.length && /^\s*$/.test(line.substring(match[0].length))) fence = undefined
            previous = ""
          } else if (match) {
            fence = match[1]
            previous = ""
          } else {
            if (/^ {0,3}#(?:\s|$)/.test(line) || (previous.trim().length > 0 && /^ {0,3}=+\s*$/.test(line))) hasTitle = true
            previous = line
          }
        })
        if (!hasTitle) {
          var title = f.filename.replace(/\.html$/i, "").replace(/[-_]+/g, " ").trim()
          md = "# " + title + "\n\n" + md
        }
      }
      io.writeFileString(args.target + rel, md)
    }, e => logErr(e))
