# Template          : Easy HTTP server
# Author            : Nuno Aguiar
# How to run        : ojob easyHTTPd.yaml 
# oPack dependencies: latest ojob-common;

init:
  pid : &PID  easyHTTPd.pid

ojob:
  daemon      : true
  opacks      :
  - oJob-common: 20250405
  - openaf     : 20250315
  unique      :
    pidFile     : *PID
    killPrevious: false
  argsFromEnvs: true
  catch       : printErrnl("[" + job.name + "] "); $err(exception, __, __, job.exec)
  logToConsole: true
  shareArgs   : true

include:
  - oJobHTTPd.yaml

help:
  text   : Starts a very simple HTTP server on the provided port with a simple file browser
  expects:
  - name: port 
    desc: "The port to use (default to 8888)"
  - name: path
    desc: "The path from which to browse files (default to '.')"
  - name: uri
    desc: "The default URI to use (default to '/')"

jobs: 
# -----------
- name : Init
  check:
    in:
      port   : toNumber.isNumber.default(8888)
      uri    : isString.default("/")
      path   : isString.default(".")
      mapLibs: toBoolean.isBoolean.default(true)
      sortTab: toBoolean.isBoolean.default(true)
      incURI : toBoolean.isBoolean.default(false)

