jobs:
# ------------------------
- name: Process maven file
  to  :
  - Write pom.xml file and process templates
  - Use maven to get JAR files
  - Move and clean-up

# -----------------------------------------------
- name : Write pom.xml file and process templates
  exec : |
    args.folder = _$(args.folder, "folder").default(".")
    args.updateTransitive = toBoolean(_$(args.updateTransitive, "updateTransitive").default(false))
    args.updateLevel = String(_$(args.updateLevel, "updateLevel").default(0))
    if (["0", "1", "2"].indexOf(args.updateLevel) < 0) throw "updateLevel must be 0, 1 or 2"
    args.updateLevel = Number(args.updateLevel)

    var fdata
    if (io.fileExists(args.folder + "/.maven.yaml")) {
      fdata = io.readFileYAML(args.folder + "/.maven.yaml")
    } else {
      if (io.fileExists(args.folder + "/.maven.json")) {
        fdata = io. readFileJSON(args.folder + "/.maven.json")
      } else {
        throw "no .maven.yaml or .maven.json found in '" + args.folder + "'"
      }
    }

    ow.loadJava()
    var data = { deps: [] }

    // Maven metadata lists every version; latest alone can cross the requested boundary.
    var updateVersion = r => {
      var original = String(r.version)
      if (!/^\d+\.\d+(?:\.\d+)*$/.test(original)) {
        log("Keeping non-numeric release version for " + r.group + ":" + r.id + ":" + original)
        return r.version
      }
      try {
        var maven = new ow.java.maven()
        plugin("XML")
        var uri = r.group.replace(/\./g, "/") + "/" + r.id
        var metadata = new XML(ow.obj.rest.get(maven._getURL() + "/" + uri + "/maven-metadata.xml").response).toNativeXML()
        var versions = metadata.versioning.versions.version
        var base = original.split(".").map(Number), best = original, bestParts = base
        for (var i = 0; i < versions.length(); i++) {
          var candidate = versions[i].toString()
          if (!/^\d+\.\d+(?:\.\d+)*$/.test(candidate)) continue
          var parts = candidate.split(".").map(Number)
          if (parts[0] != base[0] || (args.updateLevel == 1 && parts[1] != base[1])) continue
          for (var j = 0; j < Math.max(parts.length, bestParts.length); j++) {
            var next = parts[j] || 0, current = bestParts[j] || 0
            if (next > current) {
              best = candidate
              bestParts = parts
              break
            }
            if (next < current) break
          }
        }
        if (best != original) log("Updating " + r.group + ":" + r.id + " from " + original + " to " + best)
        return best
      } catch(e) {
        log("Could not check updates for " + r.group + ":" + r.id + ":" + original + ": " + String(e) + "; keeping declared version")
        return r.version
      }
    }

    io.rm(args.init.tmpfolder)
    io.mkdir(args.init.tmpfolder)
    io.mkdir(args.init.tmpfolder + "/target")

    if (isArray(fdata.artifacts)) {
      data.deps = fdata.artifacts.map(r => {
        if (isDef(r.id) && isDef(r.group)) {
            if (isUnDef(r.version) || r.latest === true) r.version = (new ow.java.maven()).getLatestVersion((r.group + "." + r.id).replace(/\./g, "/"))
            else if (args.updateLevel > 0) r.version = updateVersion(r)
            if (isDef(r.template)) {
              io.writeFileYAML(args.init.tmpfolder + "/.maven.yaml", { artifacts: [ { id: r.id, group: r.group, version: r.version, template: r.template } ]})
              var m = new ow.java.maven()
              m.processMavenFile(args.init.tmpfolder + "/")
              io.rm(args.init.tmpfolder + "/.maven.yaml")
              return null
            }
            return r
        } else {
          throw "artifact id or group not defined " + af.toSLON(r)
        }
      })

      data.deps = data.deps.filter(r => !isNull(r))
    }

    if (args.updateTransitive) {
      loadLib(getOPackPath("Maven") + "/maven.js")
      var m = new Maven()
      var seenGA = {}
      data.deps.forEach(r => { seenGA[r.group + ":" + r.id] = true })

      var extras = {}
      data.deps.forEach(r => {
        try {
          m.resolve(r.group + ":" + r.id + ":" + r.version).forEach(a => {
            var ga = a.groupId + ":" + a.artifactId
            if (!seenGA[ga] && isUnDef(extras[ga])) extras[ga] = { group: a.groupId, id: a.artifactId }
          })
        } catch(e) {
          log("Could not resolve transitive dependencies for " + r.group + ":" + r.id + ":" + r.version + ": " + String(e))
        }
      })

      Object.keys(extras).forEach(ga => {
        var e = extras[ga]
        e.version = (new ow.java.maven()).getLatestVersion((e.group + "." + e.id).replace(/\./g, "/"))
        data.deps.push(e)
      })
    }

    io.writeFileString(args.init.tmpfolder + "/pom.xml", templify(args.init.pomxml, data))

# --------------------------------
- name: Use maven to get JAR files
  exec: |
    $sh("mvn clean dependency:copy-dependencies -DoutputDirectory=.")
    .pwd(args.init.tmpfolder)
    .prefix("mvn")
    .get()

# -----------------------
- name: Move and clean-up
  exec: |
    io.mkdir(args.folder)
    if (io.fileExists(args.init.tmpfolder + "/target")) {
      io.listFiles(args.init.tmpfolder + "/target").files.forEach(r => {
        io.mv(r.canonicalPath, args.folder + "/" + r.filename)
      })
    }
    $from(io.listFiles(args.init.tmpfolder).files).ends("filename", ".jar").select(r => {
      io.mv(r.canonicalPath, args.folder + "/" + r.filename)
    })
    io.rm(args.init.tmpfolder)
