init:
  tmpfolder: .mvnTemp 
  pomxml   : |
    <project>
      <modelVersion>4.0.0</modelVersion>
      <groupId>com.mycompany.app</groupId>
      <artifactId>my-app</artifactId>
      <version>1.0-SNAPSHOT</version>
      <name>my-app</name>
      <url>http://www.example.com</url>
      <properties>
        <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
        <maven.compiler.source>1.7</maven.compiler.source>
        <maven.compiler.target>1.7</maven.compiler.target>
      </properties>
      <dependencies>
        {{#each deps}}<dependency>
          <groupId>{{group}}</groupId>
          <artifactId>{{id}}</artifactId>
          <version>{{version}}</version>
        </dependency>{{/each}}
      </dependencies>
      <build>
        <pluginManagement>
          <plugins>
            <plugin>
              <artifactId>maven-clean-plugin</artifactId>
              <version>3.1.0</version>
            </plugin>
            <plugin>
              <artifactId>maven-resources-plugin</artifactId>
              <version>3.0.2</version>
            </plugin>
            <plugin>
              <artifactId>maven-compiler-plugin</artifactId>
              <version>3.8.0</version>
            </plugin>
            <plugin>
              <artifactId>maven-surefire-plugin</artifactId>
              <version>2.22.1</version>
            </plugin>
            <plugin>
              <artifactId>maven-jar-plugin</artifactId>
              <version>3.0.2</version>
            </plugin>
            <plugin>
              <artifactId>maven-install-plugin</artifactId>
              <version>2.5.2</version>
            </plugin>
            <plugin>
              <artifactId>maven-deploy-plugin</artifactId>
              <version>2.8.2</version>
            </plugin>
            <plugin>
              <artifactId>maven-site-plugin</artifactId>
              <version>3.7.1</version>
            </plugin>
            <plugin>
              <artifactId>maven-project-info-reports-plugin</artifactId>
              <version>3.0.0</version>
            </plugin>
            <plugin>
              <groupId>org.apache.maven.plugins</groupId>
              <artifactId>maven-dependency-plugin</artifactId>
              <configuration>
                <outputDirectory>${project.build.directory}</outputDirectory>
              </configuration>
            </plugin>
          </plugins>
        </pluginManagement>
      </build>
    </project>

help:
  text   : Given a maven dependency list file (.maven.yaml) will download all the corresponding JAR files (REQUIRES mvn to be installed)
  expects:
  - name     : folder
    desc     : The output folder where the JAR files will be placed
    example  : .
    mandatory: false
  - name     : updateTransitive
    desc     : If true, transitive dependencies of the declared artifacts will also be added as direct dependencies pinned to their own latest version (overriding whatever older version was pulled in transitively)
    example  : true
    mandatory: false
  - name     : updateLevel
    desc     : "Opt-in upgrades of declared numeric release versions: 0 (default) keeps pinned versions; 1 selects the latest patch within the same major/minor; 2 selects the latest minor/patch within the same major. Qualified versions and version ranges are kept. Missing versions and latest=true retain their existing latest-version behavior. Does not change updateTransitive."
    example  : 1
    mandatory: false

ojob:
  opacks      :
  - openaf: 20211229
  - Maven  : 20260528
  catch       : logErr(exception)
  logToConsole: true   # to change when finished 

