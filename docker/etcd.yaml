# Author: Nuno Aguiar
help:
  text   : Generates a quick docker-compose with etcd
  expects:
  - name     : cluster
    desc     : If defined will add the number of etcd nodes specified.
    mandatory: false
    example  : 3
  - name     : tag
    desc     : Docker image tag to use (defaults to the latest stable version from quay.io)
    mandatory: false
    example  : v3.6.12

init:
  dc: |
    networks:
      etcd:
        driver: bridge

    services:
    {{#if single}}  etcd       :
        restart    : always
        image      : quay.io/coreos/etcd:{{tag}}
        ports      :
        - "2379:2379"
        networks:
        - etcd
        healthcheck   :
          test    : [ "CMD-SHELL", "curl --silent --fail http://127.0.0.1:2379/health || exit 1" ]
          interval: 15s
          timeout : 10s
          retries : 3
        environment:
          ETCD_DATA_DIR              : /etcd-data
          ETCD_LISTEN_CLIENT_URLS    : http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS : http://etcd:2379
        volumes:
          - etcd_data:/etcd-data
    {{else}}{{#each nodes}}  {{name}}      :
        restart : always
        image   : quay.io/coreos/etcd:{{../tag}}
        networks:
        - etcd{{#if first}}
        ports   :
        - "2379:2379"{{/if}}
        healthcheck   :
          test    : [ "CMD-SHELL", "curl --silent --fail http://127.0.0.1:2379/health || exit 1" ]
          interval: 30s
          timeout : 5s
          retries : 3
        environment:
          ETCD_NAME                       : {{name}}
          ETCD_DATA_DIR                   : /etcd-data
          ETCD_ADVERTISE_CLIENT_URLS      : http://{{name}}:2379
          ETCD_INITIAL_CLUSTER            : {{{../list}}}
          ETCD_INITIAL_CLUSTER_STATE      : new
          ETCD_INITIAL_CLUSTER_TOKEN      : etcd-cluster
          ETCD_INITIAL_ADVERTISE_PEER_URLS: http://{{name}}:2380
          ETCD_LISTEN_PEER_URLS           : http://0.0.0.0:2380
          ETCD_LISTEN_CLIENT_URLS         : http://0.0.0.0:2379
        volumes:
          - {{name}}_data:/etcd-data

      {{/each}}
    {{/if}}

    volumes:{{#if single}}
      etcd_data:
        driver: local
    {{else}}{{#each nodes}}
      {{name}}_data:
        driver: local{{/each}}
    {{/if}}

todo:
- Check for docker
- Generate docker-compose

include:
- ojob.io/docker/_common

ojob:
  opacks      :
  - openaf: 20211229
  catch       : logErr(exception)
  logToConsole: false   # to change when finished
        

jobs:
# ------------------------------
- name : Generate docker-compose
  check:
    in:
      cluster: toNumber().isNumber.default(3)
  exec : |
    var tag = _$(args.tag, "tag").default(__)
    if (isUnDef(tag)) {
      var res = $rest().get("https://quay.io/api/v1/repository/coreos/etcd/tag/?limit=50&onlyActiveTags=true")
      var semverCompare = (a, b) => {
        var pa = a.replace("v", "").split(".").map(Number)
        var pb = b.replace("v", "").split(".").map(Number)
        for (var i = 0; i < 3; i++) {
          if (pa[i] > pb[i]) return -1
          if (pa[i] < pb[i]) return 1
        }
        return 0
      }
      tag = res.tags
        .map(t => t.name)
        .filter(n => /^v\d+\.\d+\.\d+$/.test(n))
        .sort(semverCompare)[0]
    }

    var data = { nodes: [], single: args.cluster == 1, tag: tag }

    Array.from(Array(args.cluster).keys()).forEach(node => {
      data.nodes.push({
        name : "etcd" + (node + 1),
        first: node == 0
      })
    })

    if (!data.single)
      data.list = data.nodes.map(n => $f("%s=http://%s:2380", n.name, n.name)).join(",")

    tprint(args.init.dc, data)